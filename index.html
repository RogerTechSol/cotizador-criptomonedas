<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
      <img src="/IMAGENES/undraw_nakamoto_uy67.svg" alt="Imagen cripto">
      
      <form id="coin-form">
        <div class="coin-input-container">
          <label for="coin">ELIGE TU MONEDA:</label>
          <select class="coin-input" id="coin">
            <option selected value="USD">Dolar</option>
            <option value="EUR">Euros</option>
            <option value="ARS">Pesos Argentinos</option>
            <option value="VES">Bolivares</option>
          </select>
       </div>

        <div class="coin-input-container">
          <label for="cryto">ELIGE TU CRYPTOMONEDA:</label>
          <!-- CORRECCIÓN: Cambiado id="coin" a id="cryto" para que tu JS lo encuentre -->
          <select class="coin-input" id="cryto">
            <option selected value="BTC">Bitcoin</option>
            <option value="ETH">Ethereum</option>
            <option value="AXS">AXS</option>
            <option value="BNB">Binance coin</option>
         </select>
        </div>

        <div class="coin-input-container">
           <label for="amount">MONTO:</label>
           <input type="text" class="coin-input" id="amount" placeholder="Monto">
        </div> 

        <!-- CORRECCIÓN: Le quité el id="amount" al botón para que no choque con el input -->
        <button type="submit">Cotizar</button>
        
        <div id="coin-inf">
          <!-- CORRECCIÓN: Arreglé las etiquetas <spam> a <span> y cerré bien los <p> -->
          <p class="info">el precio mas alto es:<span class="price">1488$</span></p>
          <p class="info">el precio mas bajo es:<span class="price">1488$</span></p>
          <p class="info">Varacion 24h es:<span class="price">1488$</span></p>
          <p class="info">Puede comprar:<span class="price">1.4431 ETH</span></p>
        </div>
        </form>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
